<title>Le Comptoir · QR Resto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Une seule ambiance sombre de bistrot, assumée : fond charbon, accents ambre. */
:root {
  color-scheme: dark;
  --bg: #14110f; --bg2: #1d1916; --card: #231e1a; --line: rgba(244,237,228,.09);
  --text: #f4ede4; --muted: #a79c8f; --accent: #e9a35b; --accent2: #d9653b; --ink: #1a120b;
  --ok: #7fc8a0; --prep: #6aa7e8; --danger: #e86a6a;
  --display: Fraunces, Georgia, serif; --body: Inter, system-ui, sans-serif;
  --ease: cubic-bezier(.2,.8,.2,1); --spring: cubic-bezier(.34,1.56,.64,1);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--text); font: 15px/1.45 var(--body); overflow-x: hidden; }
body.locked { overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
input, textarea { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 14px 20px; border-radius: 16px; font-weight: 600; text-decoration: none; transition: transform .2s var(--ease), filter .2s; }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .5; pointer-events: none; }
.btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: var(--ink); }
.btn.ghost { background: var(--card); border: 1px solid var(--line); }
.btn.sm { padding: 7px 12px; font-size: 13px; border-radius: 10px; }
.btn.block { width: 100%; margin-top: 12px; }
.toast { position: fixed; z-index: 90; left: 50%; top: calc(16px + env(safe-area-inset-top, 0px)); transform: translate(-50%, calc(-100% - 80px)); padding: 12px 18px; border-radius: 14px; background: var(--text); color: var(--bg); font-weight: 600; font-size: 14px; transition: transform .5s var(--spring); max-width: calc(100% - 32px); text-align: center; }
.toast.show { transform: translate(-50%, 0); }
.banner { font-size: 12px; text-align: center; padding: 8px 16px; background: rgba(233,163,91,.12); color: var(--accent); }
.spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: rot .7s linear infinite; }
@keyframes rot { to { transform: rotate(360deg); } }
@keyframes rise { from { transform: translateY(16px); opacity: 0; } }
@keyframes pop { from { transform: scale(0); } }
.view { animation: rise .45s var(--ease); }

/* ---------- Accueil ---------- */
.home { max-width: 980px; margin: 0 auto; padding-block: 48px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.home .mark { color: var(--accent); font-size: 28px; }
.home h1 { font: 700 clamp(40px, 8vw, 72px)/1 var(--display); letter-spacing: -.02em; margin: 14px 0 12px; text-wrap: balance; }
.home .lead { color: var(--muted); max-width: 60ch; font-size: 17px; margin: 0 0 36px; }
.doors { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
.door { background: var(--bg2); border: 1px solid var(--line); border-radius: 24px; padding: 26px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.door h2 { font: 700 28px var(--display); margin: 0; }
.door p { margin: 0; color: var(--muted); }
.door .eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--accent); }
.tables { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.tables a { display: grid; place-items: center; aspect-ratio: 1; max-width: 100%; border-radius: 14px; background: var(--card); border: 1px solid var(--line); text-decoration: none; font: 700 22px var(--display); transition: all .2s var(--ease); }
.tables a span { text-align: center; }
.tables a small { display: block; font: 500 10px var(--body); color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.tables a:hover { border-color: var(--accent); transform: translateY(-2px); }
.how { margin-top: 28px; color: var(--muted); font-size: 14px; display: grid; gap: 6px; }

/* ---------- Client ---------- */
.cli { padding-bottom: 120px; }
.bg-glow { position: fixed; inset: -20% -20% auto; height: 70vh; z-index: 0; pointer-events: none;
  background: radial-gradient(40% 50% at 20% 30%, rgba(233,163,91,.22), transparent 70%), radial-gradient(35% 45% at 85% 10%, rgba(217,101,59,.18), transparent 70%);
  filter: blur(20px); animation: drift 14s ease-in-out infinite alternate; }
@keyframes drift { to { transform: translate3d(4%, 6%, 0) scale(1.08); } }
.cli > *:not(.bg-glow) { position: relative; z-index: 1; }
.splash { position: fixed !important; inset: 0; z-index: 100 !important; display: grid; place-items: center; background: var(--bg); transition: opacity .7s var(--ease), visibility .7s; text-align: center; }
.splash.out { opacity: 0; visibility: hidden; }
.splash .l { font-size: 44px; color: var(--accent); animation: spin-in 1s var(--spring) both; }
.splash .n { font: 700 34px/1.1 var(--display); margin-top: 10px; animation: rise .8s .25s var(--ease) both; }
.splash .t { margin-top: 10px; color: var(--muted); letter-spacing: .2em; text-transform: uppercase; font-size: 12px; animation: rise .8s .45s var(--ease) both; }
@keyframes spin-in { from { transform: rotate(-180deg) scale(0); opacity: 0; } }
.wrap { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.hero { padding-block: 18px 8px; }
.hero-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.table-badge { padding: 7px 14px; border-radius: 99px; font-weight: 600; font-size: 13px; background: rgba(233,163,91,.12); color: var(--accent); border: 1px solid rgba(233,163,91,.25); text-decoration: none; }
.hero-actions { display: flex; gap: 8px; }
.icon-btn { position: relative; width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; background: var(--card); border: 1px solid var(--line); }
.icon-btn .dot { position: absolute; top: 8px; right: 8px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: ping 1.8s infinite; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(233,163,91,.7); } 70%, 100% { box-shadow: 0 0 0 8px rgba(233,163,91,0); } }
.hero h1 { font: 700 clamp(38px, 11vw, 58px)/1 var(--display); margin: 26px 0 6px; letter-spacing: -.02em; }
.hero p { margin: 0; color: var(--muted); }
.cats { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20 !important; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-block: 14px; margin-top: 14px; background: linear-gradient(var(--bg) 70%, transparent); }
.cats::-webkit-scrollbar { display: none; }
.cat { flex: none; padding: 9px 16px; border-radius: 99px; font-weight: 500; font-size: 14px; background: var(--card); border: 1px solid var(--line); color: var(--muted); transition: all .3s var(--ease); }
.cat.active { background: var(--text); color: var(--bg); border-color: var(--text); }
.section { padding-top: 18px; scroll-margin-top: 70px; }
.section h2 { font: 700 26px var(--display); margin: 6px 4px 14px; }
.item { display: flex; gap: 14px; align-items: center; padding: 14px; margin-bottom: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 20px; cursor: pointer; animation: rise .55s var(--ease) both; }
.item.soldout { filter: grayscale(1); opacity: .45; pointer-events: none; }
.item.soldout .price::after { content: ' · Épuisé'; color: var(--muted); font-weight: 500; }
.item-emoji { flex: none; width: 74px; height: 74px; border-radius: 18px; display: grid; place-items: center; font-size: 38px; background: radial-gradient(circle at 30% 25%, rgba(233,163,91,.35), rgba(217,101,59,.12) 60%, transparent), var(--bg2); }
.item-body { flex: 1; min-width: 0; }
.item-name { font-weight: 600; font-size: 16px; }
.item-desc { color: var(--muted); font-size: 13px; margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.item-foot { display: flex; align-items: center; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
.price { font-weight: 700; color: var(--accent); }
.tags { display: flex; gap: 6px; flex-wrap: wrap; }
.tag { font-size: 11px; padding: 3px 8px; border-radius: 99px; background: rgba(244,237,228,.07); color: var(--muted); }
.tag.sig { background: rgba(233,163,91,.15); color: var(--accent); }
.add { flex: none; width: 38px; height: 38px; border-radius: 12px; font-size: 22px; line-height: 1; background: var(--accent); color: var(--ink); font-weight: 600; transition: transform .25s var(--spring); }
.add:active { transform: scale(.8) rotate(90deg); }
.qty-pill { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: var(--accent); color: var(--ink); animation: pop .35s var(--spring); }
.foot { text-align: center; color: var(--muted); font-size: 12px; padding-block: 30px; }
.cart-bar { position: fixed !important; z-index: 30 !important; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-radius: 20px; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: var(--ink); font-weight: 600; box-shadow: 0 18px 40px -12px rgba(217,101,59,.6); animation: bar-in .5s var(--spring); }
.cart-bar.bump { animation: bump .45s var(--spring); }
@keyframes bar-in { from { transform: translateY(140%); } }
@keyframes bump { 40% { transform: scale(1.05); } }
.cart-count { background: var(--ink); color: var(--accent); min-width: 28px; height: 28px; border-radius: 10px; display: grid; place-items: center; font-size: 13px; }
.cart-label { flex: 1; text-align: left; }
.flyer { position: fixed; z-index: 60; font-size: 30px; pointer-events: none; transition: transform .7s cubic-bezier(.5,-.3,.7,.6), opacity .7s; }
.scrim { position: fixed !important; inset: 0; z-index: 40 !important; background: rgba(8,6,5,.6); backdrop-filter: blur(4px); opacity: 0; visibility: hidden; transition: opacity .35s, visibility .35s; }
.scrim.show { opacity: 1; visibility: visible; }
.sheet { position: fixed !important; z-index: 50 !important; left: 0; right: 0; bottom: 0; max-width: 640px; margin: 0 auto; max-height: 88vh; overflow-y: auto; overscroll-behavior: contain; padding: 10px max(20px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); background: var(--bg2); border-radius: 28px 28px 0 0; border: 1px solid var(--line); border-bottom: 0; transform: translateY(105%); transition: transform .5s var(--ease); visibility: hidden; }
.sheet.show { transform: none; visibility: visible; }
.handle { width: 40px; height: 5px; border-radius: 9px; background: var(--line); margin: 0 auto 14px; }
.sheet h2 { font: 700 26px var(--display); margin: 6px 0 10px; }
.sheet .desc { color: var(--muted); margin: 0 0 10px; }
.item-hero { height: 150px; border-radius: 22px; display: grid; place-items: center; font-size: 80px; margin-bottom: 10px; background: radial-gradient(circle at 50% 40%, rgba(233,163,91,.35), rgba(217,101,59,.1) 55%, transparent 75%), var(--card); }
.sheet.show .item-hero { animation: float-in .6s .1s var(--spring) both; }
@keyframes float-in { from { transform: scale(.6) translateY(20px); opacity: 0; } }
.field { display: block; margin: 14px 0; }
.field span { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; text-transform: uppercase; letter-spacing: .08em; }
.field input, .field textarea { width: 100%; padding: 13px 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); outline: none; resize: none; }
.field input:focus, .field textarea:focus { border-color: var(--accent); }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; }
.stepper { display: flex; align-items: center; gap: 4px; background: var(--card); border-radius: 14px; padding: 4px; border: 1px solid var(--line); }
.stepper button { width: 30px; height: 30px; border-radius: 10px; font-size: 18px; }
.stepper span { min-width: 22px; text-align: center; font-weight: 600; }
.stepper.big button { width: 40px; height: 44px; }
.cline { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.cline .e { font-size: 26px; }
.cline .n { flex: 1; min-width: 0; }
.cline .n small { display: block; color: var(--muted); font-size: 12px; }
.cline .p { font-weight: 600; min-width: 64px; text-align: right; font-variant-numeric: tabular-nums; }
.pay-choice { margin: 16px 0 6px; display: grid; gap: 10px; }
.lbl { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.pay-opt { position: relative; }
.pay-opt input { position: absolute; opacity: 0; }
.pay-card { display: flex; gap: 14px; align-items: center; padding: 14px; border-radius: 16px; background: var(--card); border: 1.5px solid var(--line); transition: all .25s var(--ease); cursor: pointer; }
.pay-card small { display: block; color: var(--muted); font-size: 12px; }
.pay-opt input:checked + .pay-card { border-color: var(--accent); background: rgba(233,163,91,.08); }
.pay-opt input:focus-visible + .pay-card { outline: 2px solid var(--accent); }
.total-row { display: flex; justify-content: space-between; font: 700 20px var(--display); margin: 18px 0 4px; }
.demo-note { font-size: 12px; color: var(--accent); background: rgba(233,163,91,.1); padding: 8px 12px; border-radius: 10px; }
.cc { margin: 16px 0 6px; aspect-ratio: 1.586; width: 100%; max-width: 360px; border-radius: 20px; padding: 22px; position: relative; overflow: hidden; background: linear-gradient(135deg, #3a2a1e, #1a1411 60%); border: 1px solid rgba(233,163,91,.3); display: flex; flex-direction: column; justify-content: space-between; font-family: ui-monospace, monospace; }
.cc::after { content: ''; position: absolute; inset: -50%; background: linear-gradient(115deg, transparent 40%, rgba(255,255,255,.12) 50%, transparent 60%); animation: shine 3.5s infinite; }
@keyframes shine { from { transform: translateX(-60%); } to { transform: translateX(60%); } }
.cc-chip { width: 44px; height: 32px; border-radius: 7px; background: linear-gradient(135deg, #e9c37b, #a77b3a); }
.cc-num { font-size: clamp(16px, 5vw, 21px); letter-spacing: .12em; }
.cc-bottom { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); text-transform: uppercase; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.two .field { margin: 0; }
.track { padding-bottom: 18px; margin-bottom: 18px; border-bottom: 1px solid var(--line); }
.track:last-child { border-bottom: 0; }
.track-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.track-head h3 { font: 700 24px var(--display); margin: 0; }
.badge { font-size: 12px; padding: 4px 10px; border-radius: 99px; background: rgba(127,200,160,.15); color: var(--ok); white-space: nowrap; }
.badge.warn { background: rgba(233,163,91,.15); color: var(--accent); }
.check { width: 84px; height: 84px; margin: 6px auto 14px; display: block; }
.check circle { stroke: var(--ok); stroke-width: 3; fill: none; stroke-dasharray: 240; stroke-dashoffset: 240; animation: draw .7s var(--ease) forwards; }
.check path { stroke: var(--ok); stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 60; stroke-dashoffset: 60; animation: draw .45s .55s var(--ease) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.track-msg { text-align: center; color: var(--muted); margin: 0 0 16px; }
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 16px 0 12px; }
.step { text-align: center; font-size: 11px; color: var(--muted); }
.step i { display: block; height: 5px; border-radius: 9px; background: var(--line); margin-bottom: 8px; position: relative; overflow: hidden; }
.step.done i { background: var(--ok); }
.step.current i::after { content: ''; position: absolute; inset: 0; background: var(--accent); animation: load 1.6s ease-in-out infinite; }
@keyframes load { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
.step.done, .step.current { color: var(--text); }
.track-items { font-size: 13px; color: var(--muted); }
.call-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 10px 0; }
.call-opt { padding: 22px 12px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); font-weight: 600; display: grid; gap: 8px; justify-items: center; }
.call-opt span { font-size: 32px; }

/* ---------- Restaurant ---------- */
.adm { min-height: 100vh; font-size: 14px; }
.login { min-height: 90vh; display: grid; place-items: center; padding-inline: 16px; background: radial-gradient(50% 50% at 50% 30%, rgba(233,163,91,.12), transparent); }
.login form { width: 100%; max-width: 340px; text-align: center; display: grid; gap: 12px; }
.login h1 { margin: 0; font: 700 28px var(--display); }
.login p { margin: 0 0 8px; color: var(--muted); }
.login input { padding: 16px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); font-size: 24px; text-align: center; letter-spacing: .5em; outline: none; }
.login input:focus { border-color: var(--accent); }
.err { color: var(--danger); min-height: 20px; }
.shake { animation: shake .4s; }
@keyframes shake { 25%, 75% { transform: translateX(-8px); } 50% { transform: translateX(8px); } }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; display: flex; align-items: center; gap: 14px 18px; padding-block: 12px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); background: rgba(16,14,12,.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-size: 16px; text-decoration: none; }
.brand span { color: var(--accent); }
.tabs { display: flex; gap: 4px; background: var(--bg2); padding: 4px; border-radius: 12px; overflow-x: auto; max-width: 100%; }
.tab { padding: 8px 14px; border-radius: 9px; color: var(--muted); font-weight: 500; white-space: nowrap; }
.tab.active { background: var(--card); color: var(--text); }
.count { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; background: var(--accent); color: var(--ink); font-size: 11px; font-weight: 700; margin-left: 4px; animation: pop .3s var(--spring); }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.adm .icon-btn { width: 36px; height: 36px; border-radius: 10px; }
.icon-btn.off { opacity: .4; }
.live { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--ok); white-space: nowrap; }
.live i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: blink 2s infinite; }
@keyframes blink { 50% { opacity: .3; } }
.calls { position: fixed; z-index: 20; top: calc(80px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 10px; width: min(340px, calc(100% - 32px)); }
.call { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 14px; background: var(--text); color: var(--bg); box-shadow: 0 12px 30px rgba(0,0,0,.4); animation: slide-in .5s var(--spring); font-weight: 500; }
.call span { flex: 1; }
.call b { font-size: 16px; }
.call button { padding: 6px 12px; border-radius: 8px; background: var(--bg); color: var(--text); font-size: 12px; }
@keyframes slide-in { from { transform: translateX(120%); } }
.pane { padding-block: 22px; padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: max(18px, env(safe-area-inset-right, 0px)); }
.pane-head h2 { margin: 0 0 4px; font: 700 26px var(--display); }
.pane-head p { margin: 0 0 20px; color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px; }
.stat { padding: 14px 16px; border-radius: 14px; background: var(--bg2); border: 1px solid var(--line); }
.stat small { color: var(--muted); display: block; font-size: 12px; }
.stat b { font: 700 24px var(--display); font-variant-numeric: tabular-nums; }
.board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; }
@media (max-width: 960px) { .board { grid-template-columns: 1fr; } }
.col { background: var(--bg2); border: 1px solid var(--line); border-radius: 18px; padding: 14px; min-height: 180px; }
.col h3 { font: 700 17px var(--display); margin: 2px 4px 14px; display: flex; align-items: center; gap: 8px; }
.col h3 span { margin-left: auto; font: 600 12px var(--body); color: var(--muted); }
.d { width: 10px; height: 10px; border-radius: 50%; }
.list { display: grid; gap: 12px; }
.empty { color: var(--muted); text-align: center; padding: 26px 10px; font-size: 13px; }
.order { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; position: relative; overflow: hidden; }
.order.fresh { animation: arrive .7s var(--spring); border-color: var(--accent); }
.order.fresh::before { content: ''; position: absolute; inset: 0; background: rgba(233,163,91,.14); animation: fade 2.5s forwards; pointer-events: none; }
@keyframes arrive { from { transform: scale(.85) translateY(-20px); opacity: 0; } }
@keyframes fade { to { opacity: 0; } }
.order-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.tbl { font: 700 22px var(--display); }
.num { color: var(--muted); font-size: 12px; }
.time { margin-left: auto; font-size: 12px; color: var(--muted); }
.time.late { color: var(--danger); font-weight: 600; }
.order ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.order li { display: flex; gap: 8px; }

.order .next { background: var(--text); color: var(--bg); }

// ================= Stockage partagé =================
// Base partagée claude.ai (temps réel entre appareils) ; à défaut, stockage local au navigateur.
const state = { orders: [], calls: [], soldout: {}, loaded: {} };
const listeners = new Set();
const emit = (kind) => listeners.forEach((fn) => fn(kind));
let backend = null; // { set(col,id,data), update(col,id,patch) }

function applyCollection(col, rows) {
  if (col === 'orders') state.orders = rows;
  if (col === 'calls') state.calls = rows;
  state.loaded[col] = true;
  if (col === 'settings') state.soldout = (rows.find((r) => r.id === 'menu') || {}).soldout || {};
  emit(col);
}

async function startStore() {
  let db = null;
  try { db = window.claude?.use ? await window.claude.use('db') : null; } catch { db = null; }
  if (db) {
    backend = {
      set: (c, id, d) => db.collection(c).doc(id).set(d),
      update: (c, id, p) => db.collection(c).doc(id).update(p),
    };
    for (const col of ['orders', 'calls', 'settings']) {
      db.collection(col).onSnapshot(
        (snap) => applyCollection(col, snap.docs.map((d) => ({ id: d.id, ...d.data() }))),
        () => showBanner('Connexion à la base perdue. Les commandes ne se synchronisent plus.'),
      );
    }
    return;
  }
  // Mode local : localStorage + BroadcastChannel (synchronise les onglets d'un même navigateur)
  showBanner("Mode local : la synchronisation entre appareils n'est pas disponible ici. Ouvre les deux interfaces dans deux onglets de ce navigateur.");
  const KEY = 'qrresto:';
  const read = (c) => ls.get(KEY + c, {});
  let bc = null;
  try { bc = new BroadcastChannel('qrresto'); bc.onmessage = (e) => load(e.data); } catch {}
  const load = (c) => applyCollection(c, Object.entries(read(c)).map(([id, v]) => ({ id, ...v })));
  const write = (c, obj) => { ls.set(KEY + c, obj); load(c); bc?.postMessage(c); };
  backend = {
    set: async (c, id, d) => { const o = read(c); o[id] = d; write(c, o); },
    update: async (c, id, p) => { const o = read(c); o[id] = { ...(o[id] || {}), ...p }; write(c, o); },
  };
  window.addEventListener('storage', (e) => { if (e.key?.startsWith(KEY)) load(e.key.slice(KEY.length)); });
  ['orders', 'calls', 'settings'].forEach(load);
}
async function save(op, col, id, data) {
  if (!backend) throw new Error('Connexion en cours, réessayez dans un instant');
  try { await backend[op](col, id, data); }
  catch (e) {
    const code = e?.code || '';
    if (code === 'permission_denied' || code === 'not_granted' || code === 'unauthenticated')
      throw new Error("Tu n'as pas le droit d'écrire sur cette page. Le propriétaire doit te donner l'accès Contributeur.");
    throw new Error("L'enregistrement a échoué. Vérifie ta connexion et réessaie.");
  }
}
function showBanner(t) { const b = $('#banner'); b.textContent = t; b.hidden = false; }

const today = () => new Date().toDateString();

// ================= Toast & son =================
let toastTimer;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3200);
}
let actx = null;
function unlockAudio() { try { actx ||= new (window.AudioContext || window.webkitAudioContext)(); actx.resume(); } catch {} }
function chime(short) {
  if (!actx || ls.get('qrresto-sound', true) === false) return;
  (short ? [880, 660] : [660, 880, 1320]).forEach((f, i) => {
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + i * 0.16;
    o.frequency.value = f; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.25, t + 0.02); g.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 0.5);
  });
}

    ls.set(CART_KEY, cart);
    const n = cart.reduce((s, l) => s + l.qty, 0), bar = $('#cartBar');
    bar.hidden = !n; $('#cartCount').textContent = n; $('#cartTotal').textContent = money(cartTotal());
    if (bump) { bar.classList.remove('bump'); void bar.offsetWidth; bar.classList.add('bump'); }
    document.querySelectorAll('.item').forEach((el) => {
      const q = cart.filter((l) => l.id === el.dataset.id).reduce((s, l) => s + l.qty, 0);
      let pill = $('.qty-pill', el);
      if (q && !pill) { pill = document.createElement('span'); pill.className = 'qty-pill'; $('.item-foot', el).prepend(pill); }
      if (pill) q ? (pill.textContent = '×' + q) : pill.remove();
    });
    $('#cartLines').innerHTML = cart.map((l) => { const it = ITEMS.get(l.id); return `
      <div class="cline" data-key="${esc(l.key)}"><span class="e">${it.emoji}</span>
        <div class="n">${esc(it.name)}${l.note ? `<small>« ${esc(l.note)} »</small>` : ''}</div>
        <div class="stepper"><button data-d="-1" aria-label="Retirer un">−</button><span>${l.qty}</span><button data-d="1" aria-label="Ajouter un">+</button></div>
        <span class="p">${money(it.price * l.qty)}</span></div>`; }).join('');
    $('#sheetTotal').textContent = money(cartTotal());
    if (!n && $('#cartSheet').classList.contains('show')) closeSheets();
  }
  $('#cartLines').onclick = (e) => {
    const b = e.target.closest('[data-d]'); if (!b) return;
    const l = cart.find((x) => x.key === b.closest('.cline').dataset.key);
    l.qty = Math.min(20, l.qty + +b.dataset.d);
    if (l.qty <= 0) cart = cart.filter((x) => x !== l);
    renderCart();
  };
  $('#cartBar').onclick = () => openSheet('cartSheet');
  function fly(fromEl, emoji) {
    if ($('#cartBar').hidden || !fromEl) return;
    const a = fromEl.getBoundingClientRect(), b = $('#cartCount').getBoundingClientRect();
    const f = document.createElement('div'); f.className = 'flyer'; f.textContent = emoji || fromEl.textContent.trim();
    f.style.left = a.left + a.width / 2 - 15 + 'px'; f.style.top = a.top + a.height / 2 - 15 + 'px';
    document.body.appendChild(f);
    requestAnimationFrame(() => { f.style.transform = `translate(${b.left - a.left - a.width / 2 + 15}px, ${b.top - a.top - a.height / 2 + 15}px) scale(.4)`; f.style.opacity = '.3'; });
    setTimeout(() => f.remove(), 750);
  }

  // --- Commande
  function buildOrder(payment) {
    const lines = cart.map((l) => { const it = ITEMS.get(l.id); return { id: it.id, name: it.name, emoji: it.emoji, price: it.price, qty: l.qty, note: l.note }; });
    const number = state.orders.filter((o) => new Date(o.createdAt).toDateString() === today()).length + 1;
    const now = Date.now();
    return { id: uid(), number, table: tableNo, items: lines, note: $('#orderNote').value.trim().slice(0, 300), total: lines.reduce((s, l) => s + l.price * l.qty, 0), payment, paid: false, status: 'new', createdAt: now, updatedAt: now };
  }
  $('#orderBtn').onclick = async () => {
    const out = cart.find((l) => state.soldout[l.id]);
    if (out) return toast(`« ${ITEMS.get(out.id).name} » est épuisé, retire-le du panier`);
    const payment = $('#payCard').checked ? 'card' : 'counter';
    const order = buildOrder(payment);
    if (payment === 'card') { pending = order; openPay(); return; }
    await submit(order, $('#orderBtn'), 'Commander');
  };
  async function submit(order, btn, label) {
    btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
    try {
      const { id, ...data } = order;
      await save('set', 'orders', id, data);
      mine = [...mine, id].slice(-30); ls.set(MINE_KEY, mine);
      lastStatus.set(id, order.status);
      cart = []; $('#orderNote').value = ''; renderCart();
      freshId = id; pending = null;
      closeSheets(); setTimeout(() => { renderTrack(); openSheet('trackSheet'); }, 250);
    } catch (e) { toast(e.message); }
    finally { btn.disabled = false; btn.innerHTML = label; }
  }
  function openPay() {
    $('#payForm').reset();
    $('#ccNum').textContent = '•••• •••• •••• ••••'; $('#ccName').textContent = 'NOM DU TITULAIRE'; $('#ccExp').textContent = 'MM/AA';
    $('#payBtn').textContent = 'Payer ' + money(pending.total);
    openSheet('paySheet');
  }
  $('#fNum').oninput = (e) => { const v = e.target.value.replace(/\D/g, '').slice(0, 16); e.target.value = v.replace(/(.{4})/g, '$1 ').trim(); $('#ccNum').textContent = (v + '•'.repeat(16 - v.length)).replace(/(.{4})/g, '$1 ').trim(); };
  $('#fName').oninput = (e) => { $('#ccName').textContent = e.target.value.toUpperCase() || 'NOM DU TITULAIRE'; };
  $('#fExp').oninput = (e) => { const v = e.target.value.replace(/\D/g, '').slice(0, 4); e.target.value = v.length > 2 ? v.slice(0, 2) + '/' + v.slice(2) : v; $('#ccExp').textContent = e.target.value || 'MM/AA'; };
  $('#fCvc').oninput = (e) => { e.target.value = e.target.value.replace(/\D/g, ''); };
  $('#payForm').onsubmit = async (e) => {
    e.preventDefault();
    const btn = $('#payBtn'); btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Paiement en cours…';
    await new Promise((r) => setTimeout(r, 1400));
    pending.paid = true; pending.createdAt = pending.updatedAt = Date.now();
    await submit(pending, btn, 'Payer ' + money(pending.total));
  };

  // --- Suivi
  const myOrders = () => state.orders.filter((o) => mine.includes(o.id) && recent(o, 6)).sort((a, b) => b.createdAt - a.createdAt);
  function updOrdersBtn() {
    const list = myOrders();
    $('#ordersBtn').hidden = !list.length;
    $('#ordersBtn .dot').hidden = !list.some((o) => o.status !== 'served');
  }
  function renderTrack() {
    $('#trackList').innerHTML = myOrders().map((o) => {
      const idx = STEPS.findIndex((s) => s[0] === o.status);
      return `<div class="track">
        ${o.id === freshId ? '<svg class="check" viewBox="0 0 84 84" aria-hidden="true"><circle cx="42" cy="42" r="38"/><path d="M26 43l11 11 21-23"/></svg>' : ''}
        <div class="track-head"><h3>Commande n°${o.number}</h3><span class="badge${o.paid ? '' : ' warn'}">${o.paid ? 'Payée' : 'À régler'}</span></div>
        <div class="steps">${STEPS.map((s, i) => `<div class="step ${i < idx || o.status === 'served' ? 'done' : i === idx ? 'current' : ''}"><i></i>${s[1]}</div>`).join('')}</div>
        <p class="track-msg">${STEPS[idx]?.[2] || ''}</p>
        <div class="track-items">${o.items.map((l) => `${l.qty}× ${esc(l.name)}`).join(' · ')} · <b>${money(o.total)}</b></div>
      </div>`;
    }).join('') || '<p class="track-msg">Aucune commande pour le moment.</p>';
    freshId = null;
  }
  $('#ordersBtn').onclick = () => { renderTrack(); openSheet('trackSheet'); };
  $('#trackClose').onclick = closeSheets;

  // --- Appel
  $('#callBtn').onclick = () => openSheet('callSheet');
  $('#callSheet').addEventListener('click', async (e) => {
    const b = e.target.closest('[data-reason]'); if (!b) return;
    try {
      const id = uid();
      await save('set', 'calls', id, { table: tableNo, reason: b.dataset.reason, at: Date.now(), done: false });
      closeSheets(); toast(b.dataset.reason === 'bill' ? "🧾 Un serveur arrive avec l'addition" : '🙋 Un serveur arrive');
    } catch (err) { toast(err.message); }
  });

  // --- Feuilles
  function openSheet(id) {
    document.querySelectorAll('.sheet.show').forEach((s) => s.classList.remove('show'));
    const s = $('#' + id); s.classList.add('show'); s.scrollTop = 0;
    $('#scrim').classList.add('show'); document.body.classList.add('locked');
  }
  function closeSheets() {
    pending = null;
    document.querySelectorAll('.sheet.show').forEach((s) => { s.classList.remove('show'); s.style.transform = ''; });
    $('#scrim').classList.remove('show'); document.body.classList.remove('locked');
  }
  $('#scrim').onclick = closeSheets;
  const onKey = (e) => { if (e.key === 'Escape') closeSheets(); };
  document.addEventListener('keydown', onKey);
  document.querySelectorAll('.sheet').forEach((sheet) => {
    let y0 = null, dy = 0;
    sheet.addEventListener('touchstart', (e) => { if (sheet.scrollTop <= 0) { y0 = e.touches[0].clientY; dy = 0; sheet.style.transition = 'none'; } }, { passive: true });
    sheet.addEventListener('touchmove', (e) => { if (y0 === null) return; dy = Math.max(0, e.touches[0].clientY - y0); sheet.style.transform = `translateY(${dy}px)`; }, { passive: true });
    sheet.addEventListener('touchend', () => { if (y0 === null) return; sheet.style.transition = ''; if (dy > 110) closeSheets(); else sheet.style.transform = ''; y0 = null; });
  });

  // --- Données en direct
  function sync(kind) {
    if (kind === 'settings' || !kind) {
      document.querySelectorAll('.item').forEach((el) => el.classList.toggle('soldout', !!state.soldout[el.dataset.id]));
      const gone = cart.filter((l) => state.soldout[l.id]);
      if (gone.length) { cart = cart.filter((l) => !state.soldout[l.id]); renderCart(); toast(`« ${ITEMS.get(gone[0].id).name} » vient d'être épuisé et a été retiré du panier`); }
    }
    if (kind === 'orders' || !kind) {
      for (const o of myOrders()) {
        const prev = lastStatus.get(o.id);
        if (prev && prev !== o.status) {
          if (o.status === 'preparing') toast('👨‍🍳 Votre commande est en préparation');
          if (o.status === 'ready') { toast('🎉 Votre commande arrive !'); try { navigator.vibrate?.([80, 60, 80]); } catch {} }
          if (o.status === 'served') toast('Bon appétit !');
        }
        lastStatus.set(o.id, o.status);
      }
      updOrdersBtn();
      if ($('#trackSheet').classList.contains('show')) renderTrack();
    }
  }
  listeners.add(sync); sync();
  renderCart();
  return () => { listeners.delete(sync); spy.disconnect(); document.removeEventListener('keydown', onKey); };
}
function tagsHtml(it) { return (it.tags || []).map((t) => `<span class="tag${t === 'Signature' ? ' sig' : ''}">${esc(t)}</span>`).join(''); }

// ================= Restaurant =================
function renderAdmin() {
  if (!ls.get('qrresto-staff', false) && !renderAdmin.ok) return renderLogin();
  const NEXT = { new: ['preparing', 'Lancer en cuisine'], preparing: ['ready', 'Marquer prête'], ready: ['served', 'Servie ✓'] };
  const seen = new Set(state.orders.map((o) => o.id));
  const seenCalls = new Set(state.calls.map((c) => c.id));
  const fresh = new Set();
  let tab = 'orders', primedOrders = !!state.loaded.orders, primedCalls = !!state.loaded.calls;

  $('#root').innerHTML = `
  <div class="adm view">
    <header class="top">
      <a class="brand" href="#" title="Retour à l'accueil de la démo"><span>◆</span><b>${esc(RESTO.name)}</b></a>
      <nav class="tabs" id="tabs">
        <button class="tab active" data-tab="orders">Commandes <span class="count" id="newCount" hidden></span></button>
        <button class="tab" data-tab="menu">Menu</button>
      </nav>
      <div class="top-right">
        <button class="icon-btn" id="soundBtn" title="Son des notifications" aria-label="Son des notifications">🔔</button>
        <span class="live"><i></i>En direct</span>
      </div>
    </header>
    <div class="calls" id="calls"></div>
    <section class="pane" id="pane-orders">
      <div class="stats" id="stats"></div>
      <div class="board">
        ${[['new', 'Nouvelles', 'var(--accent)'], ['preparing', 'En préparation', 'var(--prep)'], ['ready', 'Prêtes à servir', 'var(--ok)']].map(([s, l, c]) =>
          `<div class="col" data-status="${s}"><h3><i class="d" style="background:${c}"></i>${l}<span></span></h3><div class="list"></div></div>`).join('')}
      </div>
      <details class="history"><summary>Commandes servies aujourd'hui <span id="servedCount"></span></summary><div class="list" id="servedList"></div></details>
    </section>
    <section class="pane" id="pane-menu" hidden>
      <div class="pane-head"><h2>Disponibilité du menu</h2><p>Marque un plat comme épuisé : il disparaît instantanément des commandes clients.</p></div>
      <div id="menuList"></div>
    </section>
  </div>`;
  $('#soundBtn').classList.toggle('off', ls.get('qrresto-sound', true) === false);
  $('#soundBtn').onclick = () => { const on = ls.get('qrresto-sound', true) === false; ls.set('qrresto-sound', on); $('#soundBtn').classList.toggle('off', !on); if (on) { unlockAudio(); chime(true); } };
  $('#tabs').onclick = (e) => {
    const t = e.target.closest('.tab'); if (!t) return; tab = t.dataset.tab;
    document.querySelectorAll('.tab').forEach((x) => x.classList.toggle('active', x === t));
    $('#pane-orders').hidden = tab !== 'orders'; $('#pane-menu').hidden = tab !== 'menu';
    if (tab === 'menu') renderMenu();
  };

  const elapsed = (t) => { const m = Math.floor((Date.now() - t) / 60000); return m < 1 ? "à l'instant" : m < 60 ? `il y a ${m} min` : `il y a ${Math.floor(m / 60)} h ${String(m % 60).padStart(2, '0')}`; };
  function card(o) {
    const late = o.status !== 'served' && Date.now() - o.createdAt > 20 * 60000, next = NEXT[o.status];
    return `<article class="order${fresh.has(o.id) ? ' fresh' : ''}" data-id="${esc(o.id)}">
      <div class="order-head"><span class="tbl">Table ${o.table}</span><span class="num">#${String(o.number).padStart(3, '0')}</span><span class="time${late ? ' late' : ''}" data-t="${o.createdAt}">${elapsed(o.createdAt)}</span></div>
      <ul>${(o.items || []).map((l) => `<li><span class="q">${l.qty}×</span><span>${esc(l.emoji)} ${esc(l.name)}${l.note ? `<small>→ ${esc(l.note)}</small>` : ''}</span></li>`).join('')}</ul>
      ${o.note ? `<div class="onote">📝 ${esc(o.note)}</div>` : ''}
      <div class="order-foot">
        <span class="pay ${o.paid ? 'ok' : 'due'}">${o.paid ? (o.payment === 'card' ? '💳 Payée' : '✓ Encaissée') : '€ À encaisser'}</span>
        <span class="total">${money(o.total)}</span><span class="grow"></span>
        ${!o.paid ? '<button class="btn sm ghost" data-act="paid">Encaissée</button>' : ''}
        ${next ? `<button class="btn sm next" data-act="${next[0]}">${next[1]}</button>` : ''}
      </div></article>`;
  }
  function renderOrders() {
    const list = state.orders.filter((o) => recent(o, 24) && o.status !== 'cancelled').sort((a, b) => a.createdAt - b.createdAt);
    document.querySelectorAll('.col').forEach((col) => {
      const l = list.filter((o) => o.status === col.dataset.status);
      $('h3 span', col).textContent = l.length || '';
      $('.list', col).innerHTML = l.map(card).join('') || '<div class="empty">Rien pour l\'instant</div>';
    });
    const served = list.filter((o) => o.status === 'served').reverse();
    $('#servedList').innerHTML = served.map(card).join(''); $('#servedCount').textContent = served.length ? `(${served.length})` : '';
    const nNew = list.filter((o) => o.status === 'new').length;
    $('#newCount').hidden = !nNew; $('#newCount').textContent = nNew;
    const todays = list.filter((o) => new Date(o.createdAt).toDateString() === today());
    $('#stats').innerHTML = [['En cours', list.filter((o) => o.status !== 'served').length], ['Commandes du jour', todays.length],
      ['Chiffre du jour', money(todays.reduce((s, o) => s + o.total, 0))], ['Reste à encaisser', money(list.filter((o) => !o.paid).reduce((s, o) => s + o.total, 0))]]
      .map(([k, v]) => `<div class="stat"><small>${k}</small><b>${v}</b></div>`).join('');
  }
  $('#pane-orders').addEventListener('click', async (e) => {
    const b = e.target.closest('[data-act]'); if (!b) return;
    b.disabled = true;
    const id = b.closest('.order').dataset.id, act = b.dataset.act;
    try { await save('update', 'orders', id, act === 'paid' ? { paid: true, updatedAt: Date.now() } : { status: act, updatedAt: Date.now() }); }
    catch (err) { toast(err.message); b.disabled = false; }
  });
  function renderCalls() {
    const active = state.calls.filter((c) => !c.done && Date.now() - c.at < 30 * 60000).sort((a, b) => b.at - a.at);
    $('#calls').innerHTML = active.map((c) => `<div class="call" data-id="${esc(c.id)}"><span>${c.reason === 'bill' ? '🧾' : '🙋'} <b>Table ${c.table}</b><br>${c.reason === 'bill' ? "demande l'addition" : 'appelle un serveur'}</span><button>J'y vais</button></div>`).join('');
  }
  $('#calls').onclick = async (e) => {
    const b = e.target.closest('button'); if (!b) return;
    try { await save('update', 'calls', b.closest('.call').dataset.id, { done: true }); } catch (err) { toast(err.message); }
  };
  function renderMenu() {
    $('#menuList').innerHTML = MENU.map((c) => `<div class="mcat"><h3>${c.icon} ${esc(c.name)}</h3>${c.items.map((it) => { const on = !state.soldout[it.id]; return `
      <div class="mitem${on ? '' : ' off'}" data-id="${it.id}"><span class="e">${it.emoji}</span><div class="n"><b>${esc(it.name)}</b><small>${money(it.price)}</small></div>
      <span class="st">${on ? 'Disponible' : 'Épuisé'}</span><button class="switch${on ? ' on' : ''}" role="switch" aria-checked="${on}" aria-label="${esc(it.name)} disponible"></button></div>`; }).join('')}</div>`).join('');
  }
  $('#menuList').onclick = async (e) => {
    const sw = e.target.closest('.switch'); if (!sw) return;
    const id = sw.closest('.mitem').dataset.id, soldout = { ...state.soldout };
    if (soldout[id]) delete soldout[id]; else soldout[id] = true;
    try { await save('set', 'settings', 'menu', { soldout }); } catch (err) { toast(err.message); }
  };

  function sync(kind) {
    if (kind === 'orders' || !kind) {
      let ding = false;
      if (!primedOrders) { if (state.loaded.orders) { primedOrders = true; state.orders.forEach((o) => seen.add(o.id)); } }
      else for (const o of state.orders) {
        if (!seen.has(o.id)) { seen.add(o.id); if (o.status === 'new') { fresh.add(o.id); ding = true; setTimeout(() => fresh.delete(o.id), 3000); toast(`Nouvelle commande, table ${o.table}`); } }
      }
      if (ding) chime();
      renderOrders();
    }
    if (kind === 'calls' || !kind) {
      if (primedCalls && state.calls.some((c) => !seenCalls.has(c.id) && !c.done)) chime(true);
      if (state.loaded.calls) primedCalls = true;
      state.calls.forEach((c) => seenCalls.add(c.id));
      renderCalls();
    }
    if ((kind === 'settings' || !kind) && tab === 'menu') renderMenu();
  }
  listeners.add(sync); sync();
  const timer = setInterval(() => document.querySelectorAll('.time[data-t]').forEach((el) => { el.textContent = elapsed(+el.dataset.t); }), 30000);
  return () => { listeners.delete(sync); clearInterval(timer); };
}
function renderLogin() {
  $('#root').innerHTML = `
  <div class="login view"><form id="loginForm">
    <div style="font-size:38px;color:var(--accent)">◆</div>
    <h1>Espace restaurant</h1><p>Entre le code PIN du personnel (démo : ${RESTO.pin})</p>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="••••" aria-label="Code PIN">
    <button class="btn primary" type="submit">Se connecter</button>
    <div class="err" id="loginErr" role="alert"></div>
    <a href="#" style="color:var(--muted);font-size:13px">Retour à l'accueil</a>
  </form></div>`;
  $('#pin').focus();
  $('#loginForm').onsubmit = (e) => {
    e.preventDefault(); unlockAudio();
    if ($('#pin').value !== RESTO.pin) {
      $('#loginErr').textContent = 'Code incorrect'; const f = $('#loginForm');
      f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake'); $('#pin').value = ''; return;
    }
    renderAdmin.ok = true; ls.set('qrresto-staff', true); route();
  };
  return null;
}
document.addEventListener('click', unlockAudio, { once: true });

route();
startStore();
})();
</script>
